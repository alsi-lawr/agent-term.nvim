name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: lua tests

      - name: Install LuaLS
        env:
          LUALS_VERSION: 3.18.1
        run: |
          curl -fsSL -o /tmp/lua-language-server.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          mkdir -p /tmp/lua-language-server
          tar -C /tmp/lua-language-server -xzf /tmp/lua-language-server.tar.gz
          echo "/tmp/lua-language-server/bin" >> "$GITHUB_PATH"

      - name: Run LuaLS diagnostics
        run: lua-language-server --check=. --checklevel=Warning --check_format=pretty --configpath=.luarc.ci.json

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NVIM_VERSION: v0.12.0
      PLENARY_REF: v0.1.4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Neovim
        run: |
          curl -fsSL -o /tmp/nvim-linux-x86_64.tar.gz "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar -C /tmp -xzf /tmp/nvim-linux-x86_64.tar.gz
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Checkout plenary.nvim
        uses: actions/checkout@v6
        with:
          repository: nvim-lua/plenary.nvim
          ref: ${{ env.PLENARY_REF }}
          path: .deps/plenary.nvim

      - name: Run tests
        env:
          PLENARY_PATH: ${{ github.workspace }}/.deps/plenary.nvim
        run: bash ./run_tests.sh
